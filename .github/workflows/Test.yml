name: Test Configs

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0,18 * * * *" 
  workflow_dispatch:

jobs:
  test-configs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v6
        with:
          fetch-depth: 1      # خیلی مهم برای سرعت
          clean: true

      - name: Check protocol files
        run: |
          ls -l Splitted-By-Protocol/ || echo "Splitted-By-Protocol directory not found"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r Files/tester/requirements.txt || echo "No requirements.txt found or already installed"

      - name: Execute Test.py script
        run: |
          python Files/tester/Test.py

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "☑️ Tested configs $(date '+%Y-%m-%d %H:%M:%S')"
          file_pattern: tested/*
          push_options: --force
