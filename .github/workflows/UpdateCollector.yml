name: Update Collector
permissions:
  contents: write
on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/43 * * * *"
  workflow_dispatch:

env:
  ACTIONS_STEP_DEBUG: true  

jobs:
  update-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code (sparse with root access)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            Files/
            Splitted-By-Protocol/
            Splitted-By-Country/
            Base64/
            aggregator  # اجازه برای فایل باینری در ریشه
          sparse-checkout-cone-mode: false

      - name: Set up Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes
        run: |
          echo "Pulling latest changes from origin main..."
          git fetch origin main
          git rebase origin/main || { 
            echo "Rebase failed, attempting merge..."; 
            git rebase --abort; 
            git merge origin/main || { 
              echo "Merge failed, resetting to origin/main..."; 
              git reset --hard origin/main; 
            }; 
          }
          echo "Branch is up-to-date with origin/main"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: Files/go.mod

      - name: Build and run Go aggregator
        run: |
          echo "Building Go application..."
          cd Files
          go mod tidy
          go build -ldflags="-s -w" -o ../aggregator *.go  # بیلد به ریشه
          cd ..  # برگشت به ریشه
          echo "Starting config aggregation and sorting in root..."
          start_time=$(date +%s)
          ./aggregator || { echo "Aggregator failed"; exit 1; }
          end_time=$(date +%s)
          processing_time=$((end_time - start_time))
          echo "Config processing completed successfully in $processing_time seconds!"
          echo "PROCESSING_TIME=$processing_time" >> $GITHUB_ENV
          # پاک کردن باینری (اختیاری، چون در sparse-checkout هست)
          rm -f aggregator

      - name: Verify output files
        run: |
          echo "Verifying generated files in root..."
          echo "Sub files in root directory:"
          ls -la Sub*.txt All_Configs_Sub.txt 2>/dev/null || echo "No Sub files or All_Configs_Sub.txt found"

          echo "\nProtocol-based sorted configs (Splitted-By-Protocol):"
          ls -la Splitted-By-Protocol/ 2>/dev/null || echo "No protocol directory found"

          echo "\nCountry-based sorted configs (Splitted-By-Country):"
          ls -la Splitted-By-Country/ 2>/dev/null || echo "No country directory found"

          echo "\nBase64 directory:"
          ls -la Base64/ 2>/dev/null || echo "No Base64 directory found"

          if [ -f "All_Configs_Sub.txt" ]; then
            echo "\nAll_Configs_Sub.txt statistics:"
            count=$(grep -v '^#' "All_Configs_Sub.txt" | wc -l)
            size=$(du -h "All_Configs_Sub.txt" | cut -f1)
            echo "  All_Configs_Sub.txt: $count configs ($size)"
          fi

          if [ -d "Splitted-By-Protocol" ]; then
            echo "\nProtocol file statistics:"
            for file in Splitted-By-Protocol/*.txt; do
              [ -f "$file" ] || continue
              count=$(grep -v '^#' "$file" | wc -l)
              size=$(du -h "$file" | cut -f1)
              basename=$(basename "$file")
              echo "  $basename: $count configs ($size)"
            done
          fi

          if [ -d "Splitted-By-Country" ]; then
            echo "\nCountry file statistics:"
            for file in Splitted-By-Country/*.txt; do
              [ -f "$file" ] || continue
              count=$(grep -v '^#' "$file" | wc -l)
              size=$(du -h "$file" | cut -f1)
              basename=$(basename "$file")
              echo "  $basename: $count configs ($size)"
            done
          fi

          if [ -f "Splitted-By-Protocol/unknown.txt" ]; then
            echo "\nUnknown protocol configurations:"
            head -10 Splitted-By-Protocol/unknown.txt  # فقط 10 خط اول برای لاگ
          fi

          if [ -f "Splitted-By-Country/unknown.txt" ]; then
            echo "\nUnknown country configurations:"
            head -10 Splitted-By-Country/unknown.txt  # فقط 10 خط اول
          fi

      - name: Handle large files and prepare for commit
        run: |
          echo "Checking file sizes and handling large files in root..."

          handle_large_file() {
            local file="$1"
            local prefix="$2"

            if [ -f "$file" ]; then
              size=$(stat -c%s "$file" 2>/dev/null || echo 0)
              size_mb=$((size / 1024 / 1024))
              echo "File $file size: ${size_mb}MB"

              if [ $size_mb -gt 85 ]; then
                echo "Splitting large file: $file"
                split -b 85M "$file" "${prefix}_part_"
                rm "$file"
                echo "File split into parts with prefix: ${prefix}_part_"
              fi
            fi
          }

          for sub_file in Sub*.txt; do
            [ -f "$sub_file" ] && handle_large_file "$sub_file" "$(basename "$sub_file" .txt)"
          done
          [ -f "All_Configs_Sub.txt" ] && handle_large_file "All_Configs_Sub.txt" "All_Configs_Sub"

          find Base64 Splitted-By-Protocol Splitted-By-Country -name "*.txt" -type f 2>/dev/null | while read file; do
            prefix=$(echo "$file" | sed 's/\.txt$//')
            handle_large_file "$file" "$prefix"
          done

      - name: Clean up temporary files
        run: |
          echo "Cleaning up temporary files in root..."
          rm -f All_Configs_Sorted.txt All_Configs_base64_Sub.txt

      - name: Debug - List changes before commit
        run: |
          echo "=== GIT STATUS (changes in root) ==="
          git status --porcelain | head -20 || echo "No changes detected"
          echo "=== SPLIT PARTS ==="
          ls *_part_* 2>/dev/null || echo "No split parts found"
          echo "=== ROOT FILES ==="
          ls -la *.txt 2>/dev/null | head -10

      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9
        with:
          author_name: "GitHub Actions"
          author_email: "github-actions[bot]@users.noreply.github.com"
          message: "Fresh Update [$(date +'%H:%M')] - Outputs in root"
          add: "."  # همه تغییرات در ریشه
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
