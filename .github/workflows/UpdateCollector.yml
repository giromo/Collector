name: Update Collector
permissions:
  contents: write 

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/43 * * * *"
  workflow_dispatch:

env:
  ACTIONS_STEP_DEBUG: true

jobs:
  update-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Cache Git objects
        uses: actions/cache@v3
        with:
          path: .git
          key: ${{ runner.os }}-git-${{ github.sha }}
          restore-keys: ${{ runner.os }}-git-

      - name: Checkout code (optimized sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            Files/
            Splitted-By-Protocol/
            Splitted-By-Country/
            Base64/
            *.txt
            aggregator
          sparse-checkout-cone-mode: false

      - name: Set up Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes
        run: |
          echo "Syncing with origin/main..."
          git fetch origin main
          git rebase origin/main || { 
            echo "Rebase failed, trying merge..."; 
            git rebase --abort; 
            git merge origin/main || { 
              echo "Merge failed, forcing reset..."; 
              git reset --hard origin/main; 
            }; 
          }
          echo "Synced successfully."

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: Files/go.mod

      - name: Build and run aggregator
        run: |
          echo "Building aggregator..."
          cd Files
          go mod tidy
          go build -ldflags="-s -w" -o ../aggregator *.go
          cd ..
          echo "Running aggregator from $(pwd)..."
          start_time=$(date +%s)
          ./aggregator || { echo "Aggregator failed!"; exit 1; }
          end_time=$(date +%s)
          processing_time=$((end_time - start_time))
          echo "Aggregation completed in ${processing_time}s"
          echo "PROCESSING_TIME=$processing_time" >> $GITHUB_ENV
          rm -f aggregator

      - name: Move outputs from Files/ if needed
        run: |
          if ls Files/Sub*.txt Files/All_Configs_Sub.txt >/dev/null 2>&1; then
            echo "Moving outputs from Files/ to root..."
            mv Files/Sub*.txt . 2>/dev/null || true
            mv Files/All_Configs_Sub.txt . 2>/dev/null || true
          fi

      - name: Verify outputs + statistics
        run: |
          echo "=== OUTPUT VERIFICATION ==="
          echo "Root files:"
          ls -la Sub*.txt All_Configs_Sub.txt 2>/dev/null || echo "No root outputs!"

          for dir in Splitted-By-Protocol Splitted-By-Country Base64; do
            if [ -d "$dir" ]; then
              echo "\n$dir:"
              for f in "$dir"/*.txt; do
                [ -f "$f" ] || continue
                count=$(grep -v '^#' "$f" | wc -l)
                size=$(du -h "$f" | cut -f1)
                echo "  $(basename "$f"): $count configs ($size)"
              done
            fi
          done

          if [ -f "All_Configs_Sub.txt" ]; then
            count=$(grep -v '^#' All_Configs_Sub.txt | wc -l)
            size=$(du -h All_Configs_Sub.txt | cut -f1)
            echo "\nAll_Configs_Sub.txt: $count configs ($size)"
          fi

      - name: Handle large files (>90MB)
        run: |
          handle_large() {
            local file="$1" prefix="$2"
            [ -f "$file" ] || return
            size_mb=$(du -m "$file" | cut -f1)
            echo "$file: ${size_mb}MB"
            if [ $size_mb -gt 90 ]; then
              echo "Splitting $file..."
              split -b 90M "$file" "${prefix}_part_"
              rm -f "$file"
            fi
          }

          # Root files
          for f in Sub*.txt; do [ -f "$f" ] && handle_large "$f" "$(basename "$f" .txt)"; done
          [ -f "All_Configs_Sub.txt" ] && handle_large "All_Configs_Sub.txt" "All_Configs_Sub"

          # Directories
          find Base64 Splitted-By-Protocol Splitted-By-Country -name "*.txt" -type f | while read f; do
            prefix="$(basename "$f" .txt)"
            handle_large "$f" "$(dirname "$f")/$prefix"
          done

      - name: Clean up
        run: |
          rm -f All_Configs_Sorted.txt All_Configs_base64_Sub.txt

      - name: Commit and push
        uses: EndBug/add-and-commit@v9
        with:
          author_name: GitHub Actions
          author_email: github-actions[bot]@users.noreply.github.com
          message: "Fresh Update"
          add: "Base64/ Splitted-By-*/*.txt All_Configs_Sub.txt Sub*.txt"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
